<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Solo Founder product cockpit" />
    <title>Solo Founder</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <svg class="icon-sprite" aria-hidden="true">
      <symbol id="icon-package" viewBox="0 0 24 24"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></symbol>
      <symbol id="icon-brain" viewBox="0 0 24 24"><path d="M9.5 4A2.5 2.5 0 0 1 12 6.5v11a2.5 2.5 0 0 1-4.96.44A2.5 2.5 0 0 1 5.5 13a3 3 0 0 1 .34-5.92A2.5 2.5 0 0 1 9.5 4Z"/><path d="M14.5 4A2.5 2.5 0 0 0 12 6.5v11a2.5 2.5 0 0 0 4.96.44A2.5 2.5 0 0 0 18.5 13a3 3 0 0 0-.34-5.92A2.5 2.5 0 0 0 14.5 4Z"/></symbol>
      <symbol id="icon-layers" viewBox="0 0 24 24"><path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="m22 12.5-9.17 4.17a2 2 0 0 1-1.66 0L2 12.5"/><path d="m22 17.5-9.17 4.17a2 2 0 0 1-1.66 0L2 17.5"/></symbol>
      <symbol id="icon-list" viewBox="0 0 24 24"><path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M3 6h.01"/><path d="M3 12h.01"/><path d="M3 18h.01"/></symbol>
      <symbol id="icon-alert" viewBox="0 0 24 24"><path d="m21.73 18-8-14a2 2 0 0 0-3.46 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></symbol>
      <symbol id="icon-refresh" viewBox="0 0 24 24"><path d="M20 11a8.1 8.1 0 0 0-15.5-2M4 4v5h5"/><path d="M4 13a8.1 8.1 0 0 0 15.5 2M20 20v-5h-5"/></symbol>
      <symbol id="icon-chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
      <symbol id="icon-check" viewBox="0 0 24 24"><path d="m20 6-11 11-5-5"/></symbol>
      <symbol id="icon-x" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></symbol>
    </svg>

    <header class="app-header">
      <div class="header-main">
        <a class="brand" href="#truth" aria-label="Solo Founder home">
          <svg class="icon brand-mark" aria-hidden="true"><use href="#icon-package"></use></svg>
          <strong>Solo Founder</strong>
          <span class="environment-badge" id="environment-badge" hidden>Demo</span>
        </a>
        <nav class="top-tabs" aria-label="Dashboard views">
          <button class="top-tab is-active" type="button" data-view="truth"><svg class="icon" aria-hidden="true"><use href="#icon-brain"></use></svg>Truth <span id="truth-count">0</span></button>
          <button class="top-tab" type="button" data-view="slices"><svg class="icon" aria-hidden="true"><use href="#icon-layers"></use></svg>Slices <span id="slice-count">0</span></button>
          <button class="top-tab" type="button" data-view="work"><svg class="icon" aria-hidden="true"><use href="#icon-list"></use></svg>Work <span id="work-count">0</span></button>
          <button class="top-tab" type="button" data-view="issues"><svg class="icon" aria-hidden="true"><use href="#icon-alert"></use></svg>Issues <span id="issue-count">0</span></button>
          <button class="icon-button refresh-button" id="refresh-button" type="button" aria-label="Refresh dashboard" title="Refresh dashboard"><svg class="icon" aria-hidden="true"><use href="#icon-refresh"></use></svg></button>
        </nav>
      </div>
    </header>

    <main class="page-shell">
      <section class="data-health" id="data-health" hidden aria-live="polite"></section>
      <section class="context-strip" id="context-strip" aria-label="Current product context"></section>

      <section class="view-panel is-active" id="view-truth" data-panel="truth">
        <div class="view-toolbar">
          <div class="filter-group" id="truth-filters" aria-label="Filter Truth"></div>
          <div class="toolbar-summary" id="truth-summary"></div>
        </div>
        <div class="document-list" id="truth-list"></div>
      </section>

      <section class="view-panel" id="view-slices" data-panel="slices">
        <div class="view-toolbar">
          <div class="filter-group" id="slice-filters" aria-label="Filter Slices"></div>
          <div class="toolbar-summary" id="slice-summary"></div>
        </div>
        <div class="document-list" id="slice-list"></div>
      </section>

      <section class="view-panel" id="view-work" data-panel="work">
        <div class="view-toolbar">
          <div class="filter-group" id="work-filters" aria-label="Filter Work Packages"></div>
          <div class="toolbar-summary" id="work-summary"></div>
        </div>
        <div class="document-list" id="work-list"></div>
      </section>

      <section class="view-panel" id="view-issues" data-panel="issues">
        <div class="view-toolbar">
          <div class="filter-group" id="issue-filters" aria-label="Filter Issues"></div>
          <div class="toolbar-summary" id="issue-summary"></div>
        </div>
        <div class="document-list" id="issue-list"></div>
      </section>

      <footer class="page-footer">
        <span>Canonical Truth and Product Ledger remain authoritative</span>
        <span id="projection-source">Waiting for repository data</span>
      </footer>
    </main>

    <div class="modal-backdrop" id="slice-modal" aria-hidden="true">
      <section class="slice-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <header class="modal-header">
          <div class="modal-header-copy">
            <nav class="modal-breadcrumbs" aria-label="Detail hierarchy"><button type="button" id="modal-root">Slices</button><span>/</span><strong id="modal-id">Slice</strong></nav>
            <div class="modal-heading-row">
              <span class="modal-entity-icon" aria-hidden="true"><svg class="icon"><use href="#icon-layers"></use></svg></span>
              <div><h2 id="modal-title">Slice details</h2><p id="modal-subtitle"></p></div>
            </div>
          </div>
          <button class="modal-close" id="modal-close" type="button" aria-label="Close Slice details"><svg class="icon" aria-hidden="true"><use href="#icon-x"></use></svg></button>
        </header>
        <nav class="modal-tabs" id="modal-tabs" role="tablist" aria-label="Slice detail views"></nav>
        <div class="modal-content" id="modal-content"></div>
      </section>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
    <script src="demo-data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
